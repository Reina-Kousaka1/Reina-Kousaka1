name: Generate contribution snake

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate pink lavender contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23F5A9C7&color_dots=%23ebedf0,%23f6d6e4,%23e8c7ef,%23d7b4eb,%23c4a7e7
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23F5A9C7&color_dots=%23161b22,%23f6d6e4,%23e8c7ef,%23d7b4eb,%23c4a7e7

      - name: Publish snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
